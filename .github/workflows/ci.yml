name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # K20 (P0-1): the policy core's `Kernel<4096>` state grew to a
  # measured ~455 KiB (docs/capacity.md). Every host test builds it on
  # a test-thread stack, so the threads need headroom — the default
  # 2 MiB still fits, but the deep-park tests' own recursion plus the
  # struct measurably overflowed at 455 KiB. 16 MiB is the pin.
  RUST_MIN_STACK: 16777216

jobs:
  test:
    name: Policy-core tests (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
      - name: Run unit + integration tests
        run: cargo test --verbose

  kernel-tests:
    name: Kernel host tests (boot logic + arch encoding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
      - name: Run the boot-logic and arch-layout tests on the host
        run: cargo test -p aegis-kernel --verbose

  no-std:
    name: no_std build (thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
        with:
          targets: thumbv7em-none-eabihf
      - name: Build the policy core for bare-metal ARM
        run: cargo build --target thumbv7em-none-eabihf --verbose

  # ADR-0011: the policy core is architecture-agnostic BY COMPILER, not
  # by intention. These builds catch any x86_64 assumption in src/ the
  # moment it lands, instead of during a future aarch64/RISC-V port.
  multi-arch:
    name: Policy core cross-arch builds (aarch64 + riscv64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
        with:
          targets: aarch64-unknown-none-softfloat,riscv64imac-unknown-none-elf
      - name: Build the policy core for aarch64 (bare-metal, soft-float)
        run: cargo build --target aarch64-unknown-none-softfloat --verbose
      - name: Build the policy core for RISC-V RV64IMAC (bare-metal)
        run: cargo build --target riscv64imac-unknown-none-elf --verbose

  kernel-build:
    name: Boot image build (x86_64, two-stage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
        with:
          targets: x86_64-unknown-none
      - name: Build the full boot image (ELF64 kernel + ELF32 multiboot stub)
        run: ./boot.sh --build-only
      - name: Sanity-check the image
        run: |
          IMAGE=target/aegis-boot.elf
          KELF=target/x86_64-unknown-none/release/aegis-kernel
          KBIN=target/kernel.bin
          test -f "$IMAGE" && test -f "$KELF" && test -f "$KBIN"
          # Container: ELF32 i386 (QEMU's -kernel multiboot loader rejects ELF64).
          readelf -h "$IMAGE" | grep -q "Class:.*ELF32"
          readelf -h "$IMAGE" | grep -q "Machine:.*80386"
          readelf -h "$IMAGE" | grep -q "Entry point address:.*0x100010"
          # Multiboot magic (02 b0 ad 1b) within the first 8 KiB of the file.
          od -A x -t x1 -j 4096 -N 4 "$IMAGE" | grep -q "02 b0 ad 1b"
          # The 64-bit kernel links at the higher-half base (ADR-0002)...
          readelf -h "$KELF" | grep -q "Entry point address:.*0xffffffff80000000"
          # ...and its flat blob is embedded at exactly 2 MiB in the image.
          SIZE=$(stat -c%s "$KBIN")
          cmp <(dd if="$IMAGE" bs=1 skip=8192 count="$SIZE" 2>/dev/null) "$KBIN"
          echo "image checks: PASS"

  boot-test:
    name: Boot test (QEMU, M1 + PR-1.1/1.2 selftests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
        with:
          targets: x86_64-unknown-none
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Build, boot, and verify the M1 + exception/higher-half markers
        run: ./boot.sh --verify

  boot-test-q35:
    name: Boot test (q35 + intel-iommu: ADR-0013 DMAR discovery + fail-closed negative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
        with:
          targets: x86_64-unknown-none
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: q35 + intel-iommu + virtio-blk: DMAR found (haw, DRHD inventory)
        run: ./boot.sh --verify-q35
      - name: q35 + intel-iommu intremap=on: ADR-0019 MSI-X through the IRTE
        run: ./boot.sh --verify-q35-ir
      - name: q35 without iommu: the fail-closed absent proof
        run: ./boot.sh --verify-q35-noiommu

  no-deps:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
      - name: Assert the dependency graph contains only this repository
        run: |
          # Every line must be aegis-os or aegis-kernel (path dependency).
          test -z "$(cargo tree --workspace --prefix none 2>/dev/null \
            | grep -v '^aegis-os ' | grep -v '^aegis-kernel ' | grep -v '^$' || true)" \
            || (cargo tree --workspace && exit 1)
      - name: Unsafe-code policy (allowlist)
        run: scripts/check_unsafe.sh
      - name: IST/static-mut section check (ADR-0006)
        run: |
          cargo build -p aegis-kernel --release --target x86_64-unknown-none
          scripts/check-ist-sections.sh
      - name: Inline-asm pattern guard (ADR-0008 push/pop %rbx)
        run: |
          scripts/check-asm-patterns.sh --self-test
          scripts/check-asm-patterns.sh
      - name: Repo hygiene (no ELF cores, no oversize binaries, no secrets)
        run: |
          scripts/check-no-binaries.sh --self-test
          scripts/check-no-binaries.sh
      - name: History scan (report-only until the HUMAN purge lands)
        # Round 5, Phase C: scans every reachable blob for the incident
        # classes. FAILS (report-only) while the core dump is still in
        # history — the purge is a human step (docs/incident-core-dump.md).
        # After the purge: change --report to --strict here so a
        # recurrence fails the build.
        run: scripts/check-history-clean.sh

  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
        with:
          components: clippy
          targets: x86_64-unknown-none
      - name: Workspace clippy (host, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: Kernel clippy (release target)
        run: cargo clippy -p aegis-kernel --release --target x86_64-unknown-none -- -D warnings

  coverage:
    name: Coverage (cargo-llvm-cov, report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain  # reads rust-toolchain.toml (pinned)
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # CONTRIBUTING.md: coverage is required on host-testable code;
      # boot/arch paths that need QEMU/hardware are excluded from the
      # bucket and must be called out in the PR. Report-only for now —
      # no hard threshold gate (see CONTRIBUTING.md).
      - run: cargo llvm-cov --workspace --summary-only || true
      - name: Emit the lcov report as an artifact
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info || true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
