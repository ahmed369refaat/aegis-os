[package]
name = "aegis-kernel"
version = "0.2.0"
edition = "2021"
description = "AegisOS bootable M1 kernel for x86_64: multiboot bring-up, long mode, identity paging, real frame pool with scrub-on-free, and the M1 exit-criteria sequence (hello domain, monitor demo, 1000-cycle create/destroy)."
license = "MIT"
publish = false

[[bin]]
name = "aegis-kernel"
path = "src/main.rs"

# ADR-0012: the timer-preemption boot demo (step 12 of kmain). OFF by
# default pending the toolchain investigation in ADR-0012's open
# issues; enable with: cargo build -p aegis-kernel --release \
#   --target x86_64-unknown-none --features preempt-demo
[features]
preempt-demo = []

# Path dependency on the policy core (package `aegis-os`, crate name
# `aegis_os`): still zero external crates.
[dependencies]
aegis-os = { path = ".." }

# Host tests only: pulls the shared DmaProt contract harness
# (ADR-0015 F1) into the aegis-os build for THIS target profile
# alone — the release kernel image builds without it.
[dev-dependencies]
aegis-os = { path = "..", features = ["dma-contract"] }
