[package]
name = "aegis-os"
version = "0.2.0"
edition = "2021"
description = "AegisOS core: a no_std, zero-dependency policy kernel combining Linux-like semantics (VFS with Unix permissions and chroot, pipes, signals, fd tables, CFS scheduling, buddy allocator, rate-limited brokered sockets) with strict per-domain isolation, attenuation-only syscall masks, capabilities, W^X memory and a graduated AI behavior monitor."
license = "MIT"

[lib]
name = "aegis_os"
path = "src/lib.rs"

# Intentionally empty: core-only, no_std, zero supply-chain surface.
[dependencies]

# The K22 lane's host proof (tests/pkg_lane_cli.rs) runs the REAL
# package-manager CLI over the REAL kernel: a dev-only path dependency
# on the workspace sibling — normal builds, and the bare-metal kernel,
# never see it (same discipline as the kernel's dev-dependencies).
[dev-dependencies]
aegis-pkg = { path = "pkg" }

# Test-only contract harness shared with the kernel's host tests
# (ADR-0015 F1): the kernel's dev-dependency enables it; normal
# builds — including the bare-metal kernel — never see it.
[features]
dma-contract = []

# The bootable kernel lives in kernel-x86_64/ (path dependency, still zero
# external crates). default-members keeps plain `cargo build`/`cargo test`
# at the root scoped to the policy library.
[workspace]
members = ["kernel-x86_64", "pkg", "tcpip", "tls"]
exclude = ["examples/ring3-hello", "examples/ring3-rogue", "examples/ring3-edge"]
default-members = ["."]

[profile.release]
opt-level = 3
lto = true
# The kernel never unwinds; abort keeps the binary small and honest.
panic = "abort"
# G (review round 2): release builds panic on arithmetic overflow the
# same way debug builds do — a silent wrap on a counter or a size is a
# security bug in a kernel, and the no_std panic handler halts loudly.
overflow-checks = true

# The package manager's ring-3 image (`pkg/`): the size-optimized recipe
# the K22 measurements were taken with (opt-level z, one codegen unit —
# the shell's codegen), inheriting release's abort / overflow
# discipline and LTO. The image lives in a 128-page cage and inside the
# kernel binary, so bytes are the budget: opt-level 3 links 234 KiB of
# text, this recipe 98 KiB. boot.sh builds it with --profile pkg-image.
[profile.pkg-image]
inherits = "release"
opt-level = "z"
codegen-units = 1
