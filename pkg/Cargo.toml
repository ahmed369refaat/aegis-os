[package]
name = "aegis-pkg"
version = "0.1.0"
edition = "2021"
description = "AegisOS package manager: no_std, no_alloc, zero-dependency, Ed25519-verified atomic package transactions. File-only packages (no install scripts by design), least-privilege Fs abstraction, WAL journal with power-loss recovery."
license = "MIT"

# Intentionally empty: core-only, no_std, zero supply-chain surface.
[dependencies]

[features]
# Signing is NOT compiled into the deployed manager: the AegisOS build
# verifies only (repo keys are provisioned out-of-band). Tests and the
# host-side repo builder enable this feature.
signer = []

[lib]
name = "aegis_pkg"
path = "src/lib.rs"

[[bin]]
name = "pkg"
path = "src/main.rs"

# K22: the boot fixture builder — a HOST tool under the signer feature
# (the deployed manager verifies only). boot.sh step [0e] runs it to
# produce the signed local repo the in-VM package-manager lane
# installs from; `required-features` keeps it out of every default
# build, test and clippy pass.
[[bin]]
name = "pkg-mkrepo"
path = "src/bin/pkg-mkrepo.rs"
required-features = ["signer"]
